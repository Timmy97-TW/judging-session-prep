<title>Judging Session Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;600&display=swap">

<style>
/* Hallmark · pre-emit critique: P5 H5 E4 S5 R5 V4
 * macrostructure: Workbench · genre: editorial · theme: custom (low-chroma lab neutrals)
 * paper-band: light · display-style: high-contrast-serif (roman) · accent-hue: chromatic-green (desaturated)
 * enrichment: none. typography and data only
 */

:root{
  --paper:#F5F5F2; --surface:#FFFFFF; --surface-2:#EDEDE8; --surface-3:#E3E3DC;
  --ink:#1A1B18; --ink-2:#4E514A; --ink-3:#7A7E75;
  --rule:#DDDDD6; --rule-2:#C6C7BE;
  --accent:#45654E; --accent-soft:#E3EAE3;
  --mark:#EBE6D6; --mark-line:#8C7942;
  --danger:#8F4436; --danger-soft:#F0E2DE;
  --warn:#7E6420; --warn-soft:#EFE8D6;

  --m1:#4F6B54; --m2:#4A6272; --m3:#6A5C7A; --m4:#8A6A3E; --m5:#8A5450;
  --m1s:#E4EAE4; --m2s:#E2E8EC; --m3s:#E9E5EE; --m4s:#F0E8DA; --m5s:#F0E1DF;

  --sans:"IBM Plex Sans","Noto Sans TC",ui-sans-serif,system-ui,-apple-system,Arial,sans-serif;
  --serif:"Newsreader","Noto Serif TC",ui-serif,Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono","Noto Sans TC",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --ease-out:cubic-bezier(.16,.84,.44,1);
  --dur-fast:110ms; --dur-mid:190ms;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:68px;
  --radius:2px;
  --shadow:0 1px 2px rgba(26,27,24,.05), 0 8px 22px -14px rgba(26,27,24,.18);
  --shadow-lg:0 2px 6px rgba(26,27,24,.08), 0 26px 52px -22px rgba(26,27,24,.32);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141512; --surface:#1B1D18; --surface-2:#23261F; --surface-3:#2C2F27;
    --ink:#E8E9E2; --ink-2:#A2A69B; --ink-3:#797E72;
    --rule:#2C2F28; --rule-2:#3C4038;
    --accent:#7FAB86; --accent-soft:#1E2A20;
    --mark:#2B2718; --mark-line:#B49B62;
    --danger:#C98570; --danger-soft:#2E1D18;
    --warn:#C0A055; --warn-soft:#2B2413;
    --m1:#7FA588; --m2:#7B9DAE; --m3:#A091B4; --m4:#C3A067; --m5:#C48B84;
    --m1s:#1D2A20; --m2s:#182730; --m3s:#241F2E; --m4s:#2E2716; --m5s:#2E1E1B;
    --shadow:0 1px 2px rgba(0,0,0,.44), 0 8px 22px -14px rgba(0,0,0,.64);
    --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 26px 52px -22px rgba(0,0,0,.78);
  }
}
:root[data-theme="dark"]{
  --paper:#141512; --surface:#1B1D18; --surface-2:#23261F; --surface-3:#2C2F27;
  --ink:#E8E9E2; --ink-2:#A2A69B; --ink-3:#797E72;
  --rule:#2C2F28; --rule-2:#3C4038;
  --accent:#7FAB86; --accent-soft:#1E2A20;
  --mark:#2B2718; --mark-line:#B49B62;
  --danger:#C98570; --danger-soft:#2E1D18;
  --warn:#C0A055; --warn-soft:#2B2413;
  --m1:#7FA588; --m2:#7B9DAE; --m3:#A091B4; --m4:#C3A067; --m5:#C48B84;
  --m1s:#1D2A20; --m2s:#182730; --m3s:#241F2E; --m4s:#2E2716; --m5s:#2E1E1B;
  --shadow:0 1px 2px rgba(0,0,0,.44), 0 8px 22px -14px rgba(0,0,0,.64);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 26px 52px -22px rgba(0,0,0,.78);
}

*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-family:var(--serif);font-weight:500;font-style:normal;letter-spacing:-.012em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--radius)}
@media (prefers-reduced-motion: reduce){*{transition-duration:1ms!important}}

.wrap{max-width:1300px;margin:0 auto;padding:0 var(--s5) var(--s8)}
@media(max-width:720px){.wrap{padding:0 var(--s4) var(--s7)}}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

/* topbar */
.topbar{position:sticky;top:0;z-index:70;display:flex;gap:var(--s2);align-items:center;padding:var(--s3) 0;background:var(--paper)}
.topbar .grow{flex:1 1 auto}
.ctl{border:1px solid var(--rule);background:var(--surface);color:var(--ink-2);border-radius:99px;padding:6px 13px;font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;transition:color var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out)}
.ctl:hover{color:var(--ink);border-color:var(--rule-2)}
.langset{display:flex;border:1px solid var(--rule);border-radius:99px;overflow:hidden;background:var(--surface)}
.langset button{padding:6px 13px;font-family:var(--mono);font-size:10px;letter-spacing:.09em;color:var(--ink-3);transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out)}
.langset button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* masthead */
.masthead{padding:var(--s3) 0 var(--s5);border-bottom:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:var(--s6);align-items:end}
@media(max-width:860px){.masthead{grid-template-columns:1fr;align-items:start}}
.masthead h1{font-size:clamp(30px,4.2vw,46px);line-height:1.06;letter-spacing:-.025em;margin-top:var(--s2);overflow-wrap:anywhere;min-width:0}
.masthead .deck{margin-top:var(--s3);max-width:66ch;color:var(--ink-2);font-size:15.4px}
.masthead .deck b{color:var(--ink);font-weight:600}
.factbox{border:1px solid var(--rule);background:var(--surface);border-radius:var(--radius);padding:var(--s3) var(--s4);box-shadow:var(--shadow)}
.factbox dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px var(--s3);font-size:12.2px}
.factbox dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);align-self:center}
.factbox dd{margin:0;color:var(--ink);font-variant-numeric:tabular-nums}

/* sections */
section{margin-top:var(--s7);scroll-margin-top:var(--s5)}
.sechead{border-bottom:1px solid var(--rule);padding-bottom:var(--s3);margin-bottom:var(--s4)}
.sechead h2{font-size:24px}
.sechead p{font-size:13.4px;color:var(--ink-3);max-width:74ch;margin-top:6px}

/* board */
.board-shell{border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;height:min(1000px,calc(100vh - 96px));min-height:520px;overflow:hidden}
.board-shell:fullscreen{height:100vh;min-height:0;border:none;border-radius:0}
.board-bar{display:flex;align-items:center;gap:var(--s2);flex-wrap:nowrap;padding:6px var(--s3);border-bottom:1px solid var(--rule);background:var(--surface-2);flex:0 0 auto}
.board-bar .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.board-bar .lbl{flex:0 0 auto}
.rubricwrap{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;min-width:0;flex:1 1 auto;padding-bottom:1px}
.rubricwrap::-webkit-scrollbar{height:3px}
.rubricwrap > *{flex:0 0 auto}
.qbanner{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;padding:8px var(--s3);border-bottom:1px solid var(--mark-line);background:var(--mark);flex:0 0 auto;font-size:12.6px}
.qbanner[hidden]{display:none}
.qbanner .tag{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;color:var(--mark-line)}
.qbanner .txt{color:var(--ink);flex:1 1 320px;min-width:0}
.qbanner .cov{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.qbanner .x{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);text-decoration:underline}

.board-scroll{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain}
.board{display:grid;grid-template-columns:82px repeat(5,minmax(0,1fr));grid-template-rows:auto minmax(0,1fr) minmax(0,1fr) minmax(0,1.12fr);min-width:1220px;height:100%}

.b-corner{position:sticky;left:0;top:0;z-index:9;background:var(--surface);border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:var(--s2) var(--s2) var(--s3)}
.b-corner span{font-family:var(--mono);font-size:8.4px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);line-height:1.3}
.b-corner span b{color:var(--ink-2);font-weight:600}

.b-head{position:sticky;top:0;z-index:6;background:var(--surface);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule-2);padding:7px var(--s3) 9px;display:flex;flex-direction:column;gap:2px;transition:background var(--dur-fast) var(--ease-out)}
.b-head:nth-child(6){border-right:none}
.b-head:hover{background:var(--surface-2)}
.b-head::after{content:"";position:absolute;right:-5px;top:8px;width:9px;height:9px;border-top:1.5px solid var(--rule-2);border-right:1.5px solid var(--rule-2);transform:rotate(45deg);background:var(--surface);z-index:8;border-radius:1px}
.b-head:nth-child(6)::after{content:none}
.b-head .rail{height:3px;border-radius:2px;background:var(--mc);margin-bottom:var(--s1)}
.b-head .id{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;font-weight:600;color:var(--mc)}
.b-head .nm{font-family:var(--serif);font-size:19px;line-height:1.08}
.b-head .tags{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px}
.b-head .tg{font-family:var(--mono);font-size:8.4px;letter-spacing:.02em;line-height:1.45;border-radius:99px;padding:0 5px;color:var(--ink-2);background:var(--mcs)}
.b-head .hits{position:absolute;right:8px;top:20px;font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--mark-line);background:var(--mark);border-radius:99px;padding:1px 7px;z-index:9}
.b-head .hits[hidden]{display:none}

.b-rowlab{position:sticky;left:0;z-index:5;background:var(--surface);border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);padding:10px var(--s2)}
.b-rowlab.last{border-bottom:none}
.b-rowlab .rn{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;line-height:1.35}
.b-rowlab .rd{font-size:9.8px;color:var(--ink-3);margin-top:3px;line-height:1.32}

.b-cell{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule-2);padding:8px 6px;display:flex;flex-direction:column;gap:1px;overflow-y:auto;min-height:0;transition:opacity var(--dur-mid) var(--ease-out)}
.b-cell:nth-child(6n+6){border-right:none}
.b-cell.last{border-bottom:none}
.b-cell.dim{opacity:.2}
.b-cell.colhot{background:var(--mcs)}
.b-head.colhot{background:var(--mcs)}
.b-head.lead{box-shadow:inset 0 -3px 0 var(--mark-line)}
.b-head .cnt{font-family:var(--mono);font-size:8.2px;letter-spacing:.05em;color:var(--ink-3);margin-top:4px}
.b-head .cnt b{color:var(--ink-2);font-weight:600}

.chip{position:relative;border:none;background:transparent;border-radius:var(--radius);padding:2px 6px 2px 13px;font-size:11.8px;line-height:1.32;color:var(--ink-2);flex:0 0 auto;transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out),opacity var(--dur-mid) var(--ease-out)}
.chip::before{content:"";position:absolute;left:5px;top:.62em;width:3px;height:3px;border-radius:50%;background:var(--rule-2);transition:background var(--dur-fast) var(--ease-out)}
.chip:hover{background:var(--surface-2);color:var(--ink)}
.chip:hover::before{background:var(--mc)}
.chip.hot{background:var(--accent-soft);color:var(--ink)}
.chip.hot::before{background:var(--accent)}
.chip.qhit{background:var(--mark);color:var(--ink);font-weight:500}
.chip.qhit::before{background:var(--mark-line)}
.chip.cold{opacity:.15}
.chip.sel{background:var(--mcs);color:var(--ink);font-weight:600}
.chip.sel::before{background:var(--mc)}

.strip{flex:0 0 auto;border-top:1px solid var(--rule-2);background:var(--surface-2);padding:9px var(--s4);min-height:74px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s4);align-items:start}
@media(max-width:720px){.strip{grid-template-columns:1fr;gap:var(--s2);min-height:0}}
.strip .side{display:flex;flex-direction:column;gap:3px;width:126px}
@media(max-width:720px){.strip .side{width:auto;flex-direction:row;gap:var(--s2);align-items:center}}
.strip .sm{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.09em;color:var(--mc)}
.strip .sr{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.strip .stitle{font-family:var(--serif);font-size:17px;line-height:1.2;margin-bottom:3px}
.strip .sbody{font-size:13px;color:var(--ink-2);line-height:1.45;max-width:96ch}
.strip .sbody b{color:var(--ink);font-weight:600}
.strip .smeta{margin-top:6px;display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.strip .ssrc{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.thbtn{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;border:1px solid var(--accent);color:var(--accent);border-radius:99px;padding:2px 9px;transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out)}
.thbtn:hover{background:var(--accent);color:var(--paper)}
.strip.idle .stitle{color:var(--ink-3)}

/* judging questions */
.qgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
@media(max-width:980px){.qgrid{grid-template-columns:1fr}}
.qpanel{background:var(--surface);padding:var(--s4) var(--s4) var(--s5)}
.qpanel > header{margin-bottom:var(--s3);padding-bottom:var(--s2);border-bottom:1px solid var(--rule)}
.qpanel h3{font-size:17px}
.qpanel header p{font-size:11.8px;color:var(--ink-3);margin-top:3px}
.qset + .qset{margin-top:var(--s4)}
.qset > .setname{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:baseline;gap:var(--s2);margin-bottom:var(--s2)}
.qset > .setname .n{color:var(--ink-3);font-weight:400}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.qbtn{width:100%;display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:var(--s2);align-items:baseline;padding:5px 7px;border-radius:var(--radius);font-size:13px;line-height:1.36;color:var(--ink-2);transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out)}
.qbtn .qid{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.05em;color:var(--ink-3)}
.qbtn .qn{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.qbtn:hover{background:var(--surface-2);color:var(--ink)}
.qbtn[aria-pressed="true"]{background:var(--mark);color:var(--ink)}
.qbtn[aria-pressed="true"] .qid,.qbtn[aria-pressed="true"] .qn{color:var(--mark-line)}
.qnote{margin-top:var(--s3);padding:8px 11px;border-left:2px solid var(--rule-2);font-size:12.2px;color:var(--ink-3);background:var(--surface-2);border-radius:0 var(--radius) var(--radius) 0}

/* wall / todo / contradictions / practice */
.wallfig{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
@media(max-width:860px){.wallfig{grid-template-columns:1fr}}
.wall-pane{background:var(--surface);padding:var(--s4) var(--s4) var(--s3)}
.wall-pane.cross{background:var(--surface)}
.wall-pane .wl{font-family:var(--mono);font-size:9.6px;letter-spacing:.11em;text-transform:uppercase;font-weight:600;color:var(--ink-2)}
.wall-pane .ws{font-size:12.4px;color:var(--ink-3);margin:3px 0 var(--s3);max-width:46ch}
.wall-pane svg{width:100%;height:auto;display:block}
.wallstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-top:none;border-radius:0 0 var(--radius) var(--radius);overflow:hidden}
@media(max-width:640px){.wallstats{grid-template-columns:1fr}}
.wstat{background:var(--surface);padding:var(--s3) var(--s4)}
.wstat .v{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.wstat .l{font-size:11.8px;color:var(--ink-3);margin-top:5px;line-height:1.35}
.wallclose{margin-top:var(--s4);font-size:14.2px;color:var(--ink-2);max-width:78ch;border-left:2px solid var(--accent);padding-left:var(--s3)}

.todolist{border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.todo{display:grid;grid-template-columns:64px minmax(0,1fr) 190px;border-bottom:1px solid var(--rule)}
.todo:last-child{border-bottom:none}
@media(max-width:820px){.todo{grid-template-columns:56px minmax(0,1fr)}.todo .owner{grid-column:1/-1;border-left:none;border-top:1px solid var(--rule)}}
.todo .pri{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.08em;border-right:1px solid var(--rule);padding:6px;text-align:center}
.pri-now{background:var(--danger-soft);color:var(--danger)}
.pri-next{background:var(--warn-soft);color:var(--warn)}
.pri-later{background:var(--surface-2);color:var(--ink-3)}
.todo .body{padding:var(--s3) var(--s4)}
.todo .body h4{font-size:16px}
.todo .body p{font-size:12.7px;color:var(--ink-2);margin-top:8px}
.todo .body p span{display:block;font-family:var(--mono);font-size:8.4px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:1px}
.todo .body p.do{color:var(--ink)}
.todo .body .ev{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:8px}
.todo .owner{border-left:1px solid var(--rule);padding:var(--s3);display:flex;flex-direction:column;justify-content:center;gap:8px}
.todo .owner .mv{display:flex;flex-direction:column;gap:2px}
.todo .owner .o{font-family:var(--mono);font-size:9.4px;font-weight:600;letter-spacing:.04em}
.todo .owner .unl{font-family:var(--mono);font-size:9.6px;color:var(--ink-2);line-height:1.4}
.todo .owner .unl span{display:block;font-size:8.6px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}

.contra{display:flex;flex-direction:column;gap:var(--s3)}
.card{border:1px solid var(--rule);border-left:3px solid var(--danger);border-radius:var(--radius);background:var(--surface);padding:var(--s4) var(--s5)}
@media(max-width:720px){.card{padding:var(--s4)}}
.card .q{font-family:var(--serif);font-size:18.5px;line-height:1.26}
.card .why{font-size:12.7px;color:var(--ink-3);margin-top:6px}

 hp:[

 tags:[t("MoClo 2.0","MoClo 2.0"),t("ccaS/ccaR","ccaS/ccaR"),t("Promoters","啟動子"),t("Electroporation","電穿孔"),t("Parts","零件登錄")],

 hp:[
  c("Dr. Brophy · light in, containment first","Brophy · 用光當輸入、圍阻優先",
    "Cello could not find a promoter responsive to the stress we care about, so sensing moved to electronics and actuation to light. Kill switches also mutate easily, so containment should not rest on one: adopt a developed switch and prove physical containment alongside it. Both decisions came from one conversation.",
    "Cello 找不到能對我們在意的逆境反應的啟動子，因此感測交給電子元件、致動交給光。自殺開關也容易突變，圍阻不該只靠它一層：沿用成熟的開關，同時證明物理圍阻。這兩個決定都出自同一場對話。",
    "4/18 Stanford","4/18 史丹佛",["light","containment"],["p5","hp1","hp2","p4","hp3"]),
  c("黃介辰 · cloning troubleshooting","黃介辰 · 選殖除錯",
    "Electroporation needs very dense cell pellets and concentrated DNA, above 10k for large plasmids. Ligation is the likely reason constructs are not forming. Run a vector control and a no-plasmid control to test whether B. subtilis carries native antibiotic resistance, and verify whether the green reporter has ever been used in B. sub.",
    "電穿孔需要非常濃的菌體沉澱與高濃度 DNA，大質體要 10k 以上。構築做不出來，最可能卡在接合。要跑載體對照與無質體對照，測枯草桿菌是否帶有原生抗生素抗性；並查證綠光報導基因是否曾在枯草桿菌中使用過。",
    "7/28 中興大學","7/28 中興大學",["controls"],["p5","hp1","ms4","p6"]),
  c("黃姿碧 · secretion and media","黃姿碧 · 分泌與培養基",
    "Default to B. subtilis native signal peptides; their in-house experience with engineered ones is limited. B. sub secretes biofilm inefficiently and carries mutations that need managing. LB alone is not enough: soybean powder, brown sugar, yeast powder and fruit-extract media improved expression and biofilm without sacrificing metabolic capacity.",
    "預設使用枯草桿菌原生訊號胜肽，他們對工程化訊號胜肽的實作經驗有限。枯草桿菌分泌生物膜效率差，且帶有需要管理的突變。單用 LB 不夠：黃豆粉、黑糖、酵母粉與果萃培養基提升了表現與生物膜，且未犧牲代謝能力。",
    "8/6 中興植病系","8/6 中興植病系",["burden"],["p5","hp1","p2"]),
  c("陳文亮 · constitutive burden","陳文亮 · 組成型表現的負擔",
    "A constitutive promoter expressing both proteins continuously risks excess production and internal metabolic stress in the bacteria. Do a literature review on blue and green light regulated promoters, then validate promoter performance experimentally rather than trusting the paper.",
    "組成型啟動子讓兩個蛋白持續表現，會有過量生產與細菌內部代謝逆境的風險。先做藍光與綠光調控啟動子的文獻回顧，再用實驗驗證啟動子表現，不要只信論文。",
    "6/20 AgriTalk","6/20 AgriTalk",["burden","light"],["p5","hp1","p4"])
 ],
 wet:[

  c("Electroporation optimisation","電穿孔條件最佳化",
    "Pellet density, DNA concentration, field strength and recovery, iterated across cycles. Report the failures: this is the clearest design-build-test-learn record the team has.",
    "菌體密度、DNA 濃度、電場強度與回復條件，逐輪迭代。要報告失敗：這是團隊最清楚的 DBTL 紀錄。",

    "Wet lab × 黃姿碧","濕實驗 × 黃姿碧",["burden"],["p2","p7","ms4"]),
  c("Characterise each promoter alone","先單獨測每個啟動子",
    "Before combining them into the AND gate, characterise each promoter separately and tune thresholds in vitro. Then test activation under simulated heat and humidity. Skipping this step is why AND gates fire early, late or inconsistently.",
    "在合併成 AND 閘之前，先分別測定每個啟動子並在體外調整閾值，之後再在模擬的高溫高濕條件下測試啟動。跳過這一步，正是 AND 閘提早、延遲或不穩定啟動的原因。",

 kill:[
  {q:t("You put a light sensor in a bacterium, then built electronics to control the light. Why not let the bacterium sense the stress?","你把光感測器放進細菌，又做電子元件去控制光。為什麼不讓細菌自己感測逆境？"),
   a:t("Because no characterised B. subtilis promoter responds to the stress signal we need, and Brophy and Cello both came up empty. Light decouples sensing from actuation, which is also what makes the payload swappable. Present it as a design strength, not a workaround.","因為沒有任何已完成特性分析的枯草桿菌啟動子會對我們需要的逆境訊號反應，Brophy 與 Cello 都找不到。光把感測與致動解耦，這也正是酬載可以更換的原因。要把它講成設計優勢，不是權宜之計。")},
  {q:t("How do you know your fold change is regulation and not sick cells?","你怎麼知道誘導倍數反映的是調控，而不是細胞狀況變差？"),
   a:t("Growth curves recorded alongside expression, with 陳文亮's metabolic burden warning cited as the reason you looked. If the paired growth data does not exist, name it as the next experiment rather than implying it does.","把生長曲線與表現同時記錄，並引用陳文亮的代謝負擔提醒作為你去查的理由。如果沒有配對的生長數據，就把它講成下一個實驗，不要暗示已經有了。")}

{
 key:"m4",n:"M4",v:"--m4",soft:"--m4s",
 nm:t("Bioreactor & Hardware","生物反應器與硬體"),
 lk:t("Contained culture → membrane → root zone","封閉培養 → 膜 → 根圈"),
 tags:[t("Reactor DBTL","反應器 DBTL"),t("Hollow fibre","中空纖維膜"),t("Photometer","自製光度計"),t("LPA","光板裝置"),t("Containment","圍阻驗證")],
 rubric:[5,3,10,1],
 mission:t("You own <b>Hardware and Measurement</b>, two of the team's three nominations. The reactor makes the project deployable and legal, because physical containment replaced the kill switch. The instruments make every light number the team quotes into a measurement rather than a claim.","你擁有<b>硬體與量測</b>，團隊三個提名中的兩個。反應器讓專案可部署也合法，因為物理圍阻取代了自殺開關。而那些儀器，讓全隊引用的每一個光學數字從「說法」變成「量測」。"),
 hp:[
  c("Dr. Brophy · contain it physically","Brophy · 用物理方式圍阻",
    "Keep the bacteria inside a physical container rather than relying on a kill switch. Keep the housing clear so light passes through, and do not design a UV trigger. This conversation is the reason the reactor exists at all.",
    "把細菌留在實體容器裡，不要依賴自殺開關。外殼要透光讓光進得去，也不要設計 UV 觸發。反應器之所以存在，就是因為這場對話。",
    "4/18 Stanford","4/18 史丹佛",["containment","light"],["p5","hp1","hw1","hw2","hp3"]),
  c("張嘉修 · the missing valve","張嘉修 · 缺少的閥門",
    "You had no mechanism to push the protectant out. Add a valve after the hollow fibre to build pressure. Foaming from B. subtilis surfactant is the real operating problem: use resting cells and a cartridge. The hollow fibre is too large. And be able to explain to judges why hollow fibre at all.",
    "你們原本沒有把保護劑推出去的機制。在中空纖維膜之後加閥門建立壓力。枯草桿菌界面活性劑造成的起泡才是真正的操作問題：改用靜置細胞與卡匣。中空纖維膜太大。另外，要能對評審解釋為什麼用中空纖維。",
    "6/18 成大化工","6/18 成大化工",["mwco","burden"],["p5","hp1","hw2","p4"]),
  c("Biotech Expo · aeration and modularity","生技展 · 曝氣與模組化",
    "Dissolved oxygen monitoring and active aeration or stirring are essential for B. subtilis survival and output, not just passive containment. Modular swappable components let one core design serve different formulations, and cut servicing to roughly once a year.",
    "溶氧監測與主動曝氣或攪拌，對枯草桿菌的存活與產出是必要的，不能只做被動圍阻。模組化可抽換元件能讓同一套核心設計服務不同配方，並把保養降到約一年一次。",
    "7/18 南港展覽館","7/18 南港展覽館",[],["p5","hp1","hw2","p3"]),
  c("源鮮 · circulation and sterilisation","源鮮 · 循環與滅菌",
    "Continuous water circulation with gentle aeration; ordinary air is sufficient and pure oxygen unnecessary. Their sterilisation process could damage protein protectants. Stagnant ultrafine bubbles produce high dissolved oxygen but corrupt OD readings.",
    "持續水循環搭配輕度曝氣；一般空氣就夠，不需要純氧。他們的滅菌流程可能破壞蛋白類保護劑。滯留的超微氣泡雖能拉高溶氧，卻會干擾 OD 讀值。",
    "8/11 源鮮智慧農場","8/11 源鮮智慧農場",[],["p5","hp1","hw2","ms4"]),
  c("陳文亮 · what to sense, how often","陳文亮 · 要測什麼、多久測一次",
    "Drop soil moisture sensing: cheap inaccurate sensors already dominate and calibration across soil types needs three to four months of data. Define a clear input to output mapping such as temperature to fluorescence. Sample at minute level early, then relax to 30 to 60 minutes. The actuator delay, not the network, is the bottleneck, so the design needs a feedback loop.",
    "放棄土壤濕度感測：便宜又不準的感測器已經佔滿市場，跨土壤類型校正需要三到四個月的資料。定義清楚的輸入輸出對應，例如溫度對螢光。初期用分鐘級取樣，之後放寬到 30 至 60 分鐘。瓶頸是致動器延遲而不是網路，因此設計需要回饋迴路。",
    "4/10 + 6/20 AgriTalk","4/10 + 6/20 AgriTalk",[],["p5","hp1","hw2","ms3"])
 ],
 wet:[

 hp:[

  c("陳惠雯 · the ethical ceiling","陳惠雯 · 倫理上限",
    "Over-monitoring makes farmers dependent on sensors and blind when the sensor stays quiet. Over-protection stops plants developing their own resilience. Technology in the field is acceptable as long as it does not break the balance. Frame the work as co-existence and 農業傳承 rather than fixing nature's flaws.",

    "7/21 淡水幸福農莊","7/21 淡水幸福農莊",["threshold"],["p5","hp1","hp3","hp4","hp6"]),

  shape:t("Judges are testing whether you can adjudicate, not whether you obeyed. Separate the domains: 鄭梅君 meant the plant assay, 張嘉修 meant the reactor, 黃介辰 meant deployment. Three layers, three answers, and no contradiction once you name which is which.","評審測的是你能不能裁決，不是你有沒有服從。把層次分開：鄭梅君講的是植物試驗，張嘉修講的是反應器，黃介辰講的是部署。三個層次、三個答案；只要你說清楚誰在講哪一層，矛盾就消失了。")},
 {minds:["M1","M5"],
  q:t("You need to release protectant before stress. Your device detects stress. Explain.","保護劑必須在逆境前釋放，你的裝置卻是偵測逆境。請解釋。"),
  why:t("黃介辰 and Verslue both said protectants work as priming, applied before the event. A threshold-triggered reactor is by definition reactive.","黃介辰與 Verslue 都說保護劑是預先誘導，要在事件前施用。閾值觸發的反應器，定義上就是事後反應。"),
  shape:t("The forecast is the answer, and 黃介辰 is the reason you have one. Say what lead time the model produces and what it costs when the forecast is wrong. Naming the tension is what proves the human practices work was integrated.","答案是預測，而你會有預測正是因為黃介辰。說出模型能給多少前置時間，以及預測錯誤時的代價。把這個張力講出來，正好證明人本實踐真的被整合進去了。")},
 {minds:["M1","M5"],
  q:t("A farmer told you not to over-protect plants. Show me where that changed the engineering.","有農民叫你們不要過度保護植物。給我看這件事改了哪一段工程。"),
  why:t("陳惠雯 argued that over-protection prevents plants developing their own resilience, and that over-monitoring makes farmers dependent on sensors.","陳惠雯認為過度保護會讓植物長不出自己的韌性，過度監測會讓農民依賴感測器。"),
  shape:t("Point at the threshold value. The reactor intervenes at acute survival crises and leaves ordinary stress alone. A specific number, set for an ethical reason, defended by a farmer's argument. This is your strongest evidence for HP aspects 1 and 3.","指著那個閾值。反應器只在急性存活危機時介入，一般逆境不動。一個具體數字，因為倫理理由而設定，由一位農民的論點撐著。這是你在人本實踐第 1 與第 3 項最強的證據。")},
 {minds:["M4","M5"],
  q:t("Your device is sealed, but BAPHIQ may still call the secretions a GMO product. Then what?","你的裝置是封閉的，但防檢署仍可能把分泌物視為基改產品。那怎麼辦？"),
  why:t("The risk register lists this as a live regulatory uncertainty, and the whole 30-day biostimulant pathway depends on the contained-use argument being accepted.","風險登錄把這列為尚未解決的法規不確定性，而整條 30 天的生物刺激素路徑，都建立在封閉使用論證被接受之上。"),
  shape:t("Say you have not assumed the answer. All testing stays contained and lab-based until BAPHIQ gives written guidance, and the fallback is the longer pathway with a slower timeline. Showing you costed the downside is worth more than asserting the upside.","說你沒有預設答案。在防檢署給出書面意見前，所有測試都維持在封閉的實驗室內；備案是走比較長的路徑、接受較慢的時程。展示你算過壞情況，比斷言好情況更有價值。")},
 {minds:["M2","M5"],
  q:t("Your plan projects a 10 to 15 percent yield improvement. On what data?","你的計畫推估 10 至 15% 的產量提升。根據什麼數據？"),
  why:t("Phase 2 targets 10 to 15 percent crop-loss reduction and 20 to 30 percent fewer fungicide applications. The plant evidence available is one salinity rescue with LEA 14.","第二階段的目標是減少 10 至 15% 的作物損失，並減少 20 至 30% 的殺菌劑施用次數。目前手上的植物證據是 LEA 14 的一次鹽逆境挽救。"),
  shape:t("Call it a projection and show the assumption chain. Then name the experiment that would replace the assumption with a measurement. A projection that knows it is a projection reads as competence.","把它講成推估，並攤開假設鏈。接著點名哪一個實驗能把假設換成量測。知道自己是推估的推估，聽起來就是能力。")},
 {minds:["M3","M4"],
  q:t("Who actually built the photometer, and what did you learn from the version that failed?","光度計到底是誰做的？失敗的那一版讓你們學到什麼？"),
  why:t("Project question 6 asks how much the team did themselves, and the Hardware rubric asks for user testing and iteration. Both are answered by the same story, told badly or told well.","專案第 6 題問團隊自己做了多少，硬體評分表問使用者測試與迭代。兩者由同一個故事回答，差別只在講得好不好。"),
  shape:t("Name the students, name the cycle that failed, and name what the next build changed. A team that can only describe the working version sounds like it inherited the device rather than made it.","講出學生的名字、講出失敗的那一輪、講出下一版改了什麼。只講得出可運作版本的團隊，聽起來像是繼承了這台裝置，不是做出來的。")}

  setText("tEyebrow",UI.eyebrow); setText("tTitle",UI.title); setText("tDeck",UI.deck);
  setText("tWallH",UI.wallH); setText("tWallP",UI.wallP);

  setText("tPraH",UI.praH); setText("tPraP",UI.praP);
  setText("tFoot1",UI.foot1); setText("tFoot2",UI.foot2);
  document.getElementById("fsBtn").textContent = document.fullscreenElement?T(UI.fsOff):T(UI.fsOn);

  var fl=document.getElementById("factList"); fl.innerHTML="";
  UI.facts.forEach(function(f){fl.appendChild(el("dt",null,T(f.k))); fl.appendChild(el("dd",null,T(f.v)));});

  var pg=document.getElementById("practiceGrid"); pg.innerHTML="";
  UI.practice.forEach(function(x){
    pg.appendChild(el("div",null,'<div class="n">'+T(x.n)+'</div><h4>'+T(x.h)+'</h4><p>'+T(x.p)+'</p><ul>'+
      x.l.map(function(i){return "<li>"+T(i)+"</li>";}).join("")+'</ul>'));
  });
  renderWall();
}

/* ── the crossing diagram ── */
function renderWall(){
  var host=document.getElementById("wallFig"); host.innerHTML="";
  var rowNames=[T(UI.rowHP.n),T(UI.rowWet.n),T(UI.rowDry.n)];
  var W=600,H=200,padL=112,padR=10,padT=28,band=(H-padT-14)/3, colW=(W-padL-padR)/5;

  function svg(vertical){
    var p=['<svg viewBox="0 0 '+W+' '+H+'" role="img" preserveAspectRatio="xMidYMid meet">'];
    for(var r=0;r<3;r++){
      var y=padT+r*band;
      p.push('<rect x="'+padL+'" y="'+y+'" width="'+(W-padL-padR)+'" height="'+(band-6)+'" rx="2" fill="var(--surface-2)" stroke="var(--rule)" stroke-width="1"/>');
      p.push('<text x="'+(padL-10)+'" y="'+(y+band/2-1)+'" text-anchor="end" dominant-baseline="middle" font-family="var(--mono)" font-size="8.5" fill="var(--ink-3)">'+rowNames[r]+'</text>');
    }
    if(vertical){
      MINDS.forEach(function(m,i){
        var x=padL+i*colW+3, w=colW-6;
        p.push('<rect x="'+x+'" y="'+(padT-9)+'" width="'+w+'" height="'+(H-padT-4)+'" rx="2" fill="var('+m.soft+')" fill-opacity="0.85" stroke="var('+m.v+')" stroke-width="1.2"/>');
        p.push('<text x="'+(x+w/2)+'" y="'+(padT-14)+'" text-anchor="middle" font-family="var(--mono)" font-size="9" font-weight="600" fill="var('+m.v+')">'+m.n+'</text>');
      });
    } else {
      for(var r2=0;r2<3;r2++){
        var y2=padT+r2*band;
        p.push('<rect x="'+padL+'" y="'+y2+'" width="'+(W-padL-padR)+'" height="'+(band-6)+'" rx="2" fill="var(--rule)" fill-opacity="0.45"/>');
      }
      for(var k=1;k<3;k++){
        var wy=padT+k*band-4.5;
        p.push('<rect x="'+(padL-4)+'" y="'+(wy-1.5)+'" width="'+(W-padL-padR+8)+'" height="4" fill="var(--ink-2)"/>');
      }
      p.push('<text x="'+(W-padR-4)+'" y="'+(padT+band-9)+'" text-anchor="end" font-family="var(--mono)" font-size="8" fill="var(--ink-3)">'+(lang==="z"?"牆":"WALL")+'</text>');
      p.push('<text x="'+(W-padR-4)+'" y="'+(padT+2*band-9)+'" text-anchor="end" font-family="var(--mono)" font-size="8" fill="var(--ink-3)">'+(lang==="z"?"牆":"WALL")+'</text>');
    }
    p.push('</svg>');
    return p.join("");
  }

  var total=0, crossing=0, people={};
  MINDS.forEach(function(m){
    var f=0;
    ["hp","wet","dry"].forEach(function(r){ total+=m[r].length; if(m[r].length>0) f++; });
    if(f===3) crossing++;
    m.hp.forEach(function(i){ var k=T(i.k).split(" · ")[0]; people[k]=1; });
  });

  host.appendChild(el("div","wall-pane",
    '<div class="wl">'+T(UI.wallOld)+'</div><div class="ws">'+T(UI.wallOldSub)+'</div>'+svg(false)));
  host.appendChild(el("div","wall-pane cross",
    '<div class="wl">'+T(UI.wallNew)+'</div><div class="ws">'+T(UI.wallNewSub)+'</div>'+svg(true)));

  var st=document.getElementById("wallStats"); st.innerHTML="";
  [[total,UI.wallStat1],[crossing+" / 5",UI.wallStat2],[Object.keys(people).length,UI.wallStat3]].forEach(function(pair){
    st.appendChild(el("div","wstat",'<div class="v">'+pair[0]+'</div><div class="l">'+T(pair[1])+'</div>'));
  });
  setText("tWallClose",UI.wallClose);
}

function renderRubric(){
  var w=document.getElementById("rubricPills"); w.innerHTML="";
  function mk(label,on,fn){
    var p=el("button","ctl",label);
    p.style.padding="3px 10px"; p.style.textTransform="none"; p.style.fontSize="11px"; p.style.fontFamily="var(--sans)";
    if(on){p.style.background="var(--ink)";p.style.color="var(--paper)";p.style.borderColor="var(--ink)";}
    p.addEventListener("click",fn); return p;
  }
  w.appendChild(mk(T(UI.allAreas),activeRubric===null,function(){setRubric(null);}));
  RUBRIC.forEach(function(r,i){
    if(!MINDS.some(function(m){return m.rubric.indexOf(i)>=0;})) return;
    w.appendChild(mk(T(r),activeRubric===i,function(){setRubric(activeRubric===i?null:i);}));
  });
}
function setRubric(i){
  activeRubric=i; renderRubric();
  document.querySelectorAll(".b-cell").forEach(function(cl){
    var m=byN[cl.dataset.mind];
    cl.classList.toggle("dim", i!==null && m.rubric.indexOf(i)<0);
  });
}

var ROWS=[{k:"hp",l:UI.rowHP},{k:"wet",l:UI.rowWet},{k:"dry",l:UI.rowDry}];

function renderBoard(){
  var b=document.getElementById("board"); b.innerHTML="";
  b.appendChild(el("div","b-corner",'<span><b>'+(lang==="z"?"子團隊":"SUBTEAM")+'</b> ↓</span><span><b>'+(lang==="z"?"因果鏈":"CHAIN")+'</b> →</span>'));
  MINDS.forEach(function(m){
    var h=el("button","b-head");
    h.style.setProperty("--mc","var("+m.v+")"); h.style.setProperty("--mcs","var("+m.soft+")");
    h.style.position="sticky"; h.title=T(UI.openDossier); h.dataset.mind=m.n;
    var counts='<span class="cnt"><b>'+m.hp.length+'</b> HP <b>'+m.wet.length+'</b> WET <b>'+m.dry.length+'</b> DRY</span>';
    h.innerHTML='<div class="rail"></div><div class="id">'+m.n+'</div><div class="nm">'+T(m.nm)+'</div>'+
      '<div class="tags">'+m.tags.slice(0,4).map(function(x){return '<span class="tg">'+T(x)+'</span>';}).join("")+'</div>'+
      counts+'<span class="hits" data-hits="'+m.n+'" hidden></span>';
    h.addEventListener("click",function(){openDossier(m);});
    h.addEventListener("mouseenter",function(){setHover(m.n);});
    h.addEventListener("mouseleave",function(){setHover(null);});
    h.addEventListener("focus",function(){setHover(m.n);});
    h.addEventListener("blur",function(){setHover(null);});
    b.appendChild(h);
  });
  ROWS.forEach(function(row,ri){
    var last=ri===ROWS.length-1;
    b.appendChild(el("div","b-rowlab"+(last?" last":""),'<div class="rn">'+T(row.l.n)+'</div><div class="rd">'+T(row.l.d)+'</div>'));
    MINDS.forEach(function(m){
      var cell=el("div","b-cell"+(last?" last":""));
      cell.dataset.mind=m.n;
      cell.style.setProperty("--mc","var("+m.v+")"); cell.style.setProperty("--mcs","var("+m.soft+")");
      m[row.k].forEach(function(item){
        var ch=el("button","chip",T(item.k));
        ch.dataset.mind=m.n;
        if(item.th.length) ch.dataset.th=item.th.join(" ");
        if(item.q.length) ch.dataset.q=item.q.join(" ");
        ch.addEventListener("mouseenter",function(){ if(!selChip) showDetail(m,row,item); });
        ch.addEventListener("focus",function(){ showDetail(m,row,item); });
        ch.addEventListener("click",function(){
          if(selChip===ch){selChip=null;ch.classList.remove("sel");showIdle();}
          else{ if(selChip) selChip.classList.remove("sel"); selChip=ch; ch.classList.add("sel"); showDetail(m,row,item); }
        });
        cell.appendChild(ch);
      });
      b.appendChild(cell);
    });
  });
  applyHighlight();
  if(activeRubric!==null) setRubric(activeRubric);
}

function setHover(n){
  hoverMind=n;
  document.querySelectorAll(".b-cell,.b-head").forEach(function(x){
    x.classList.toggle("colhot", !!n && x.dataset.mind===n);
  });
}

function showIdle(){
  var s=document.getElementById("strip");
  s.className="strip idle"; s.style.setProperty("--mc","var(--ink-3)");
  s.innerHTML='<div class="side"><span class="sr">'+(lang==="z"?"說明":"GUIDE")+'</span></div><div><div class="stitle">'+
    T(UI.idleTitle)+'</div><div class="sbody">'+T(UI.idleBody)+'</div></div>';
}
function showDetail(m,row,item){
  var s=document.getElementById("strip");
  s.className="strip"; s.style.setProperty("--mc","var("+m.v+")");
  var th=item.th.map(function(k){return '<button class="thbtn" data-th="'+k+'">'+T(UI.threadLabel)+': '+T(THREADS[k].n)+'</button>';}).join("");
  var qs=item.q.length? '<span class="ssrc">'+item.q.map(function(q){return q.toUpperCase();}).join(" · ")+'</span>' : "";
  s.innerHTML='<div class="side"><span class="sm">'+m.n+' · '+T(m.nm)+'</span><span class="sr">'+T(row.l.n)+'</span></div>'+
    '<div><div class="stitle">'+T(item.k)+'</div><div class="sbody">'+T(item.d)+'</div>'+
    '<div class="smeta"><span class="ssrc">'+T(item.s)+'</span>'+qs+th+'</div></div>';
  s.querySelectorAll(".thbtn").forEach(function(btn){btn.addEventListener("click",function(){setThread(btn.dataset.th);});});
}
function setThread(k){
  activeQ=null; renderQuestions();
  activeThread=(activeThread===k)?null:k;
  applyHighlight();
  if(activeThread){
    var s=document.getElementById("strip");
    s.className="strip"; s.style.setProperty("--mc","var(--accent)");
    s.innerHTML='<div class="side"><span class="sm">'+T(UI.threadLabel).toUpperCase()+'</span></div><div><div class="stitle">'+
      T(THREADS[activeThread].n)+'</div><div class="sbody">'+T(THREADS[activeThread].d)+'</div>'+
      '<div class="smeta"><button class="thbtn" id="clrTh">'+T(UI.clearThread)+'</button></div></div>';
    document.getElementById("clrTh").addEventListener("click",function(){setThread(activeThread);});
  } else showIdle();
}
function applyHighlight(){
  var banner=document.getElementById("qbanner");
  document.querySelectorAll(".chip").forEach(function(ch){ch.classList.remove("hot","cold","qhit");});
  document.querySelectorAll("[data-hits]").forEach(function(h){h.hidden=true;h.textContent="";});
  document.querySelectorAll(".b-head").forEach(function(h){h.classList.remove("lead");});
  if(activeThread){
    document.querySelectorAll(".chip").forEach(function(ch){
      var l=(ch.dataset.th||"").split(" ");
      if(l.indexOf(activeThread)>=0) ch.classList.add("hot"); else ch.classList.add("cold");
    });
    banner.hidden=true; return;
  }
  if(activeQ){
    var meta=QMETA[activeQ], perMind={}, total=0;
    document.querySelectorAll(".chip").forEach(function(ch){
      var hit = meta.all ? true : (ch.dataset.q||"").split(" ").indexOf(activeQ)>=0;
      if(hit){ ch.classList.add("qhit"); total++; perMind[ch.dataset.mind]=(perMind[ch.dataset.mind]||0)+1; }
      else ch.classList.add("cold");
    });
    MINDS.forEach(function(m){
      var n=perMind[m.n]||0, node=document.querySelector('[data-hits="'+m.n+'"]');
      if(node&&n>0){node.hidden=false;node.textContent=n;}
    });
    (meta.lead||[]).forEach(function(id){
      var h=document.querySelector('.b-head[data-mind="'+id+'"]'); if(h) h.classList.add("lead");
    });
    var support=MINDS.filter(function(m){return perMind[m.n]&&(meta.lead||[]).indexOf(m.n)<0;}).map(function(m){return m.n;});
    var gap=(meta.lead||[]).filter(function(id){return !perMind[id];});
    var cov;
    if(meta.all){ cov=T(UI.qAll); }
    else {
      cov=total+" "+T(total===1?UI.covEntry:UI.covEntries)+
        "  ·  "+T(UI.qLead)+" "+(meta.lead||[]).join(", ")+
        (support.length?"  ·  "+T(UI.qSupport)+" "+support.join(", "):"")+
        (gap.length?"  ·  "+T(UI.covGap)+" "+gap.join(", "):"");
    }
    banner.hidden=false;
    banner.innerHTML='<span class="tag">'+activeQ.toUpperCase()+'</span><span class="txt">'+T(meta.t)+'</span>'+
      '<span class="cov">'+cov+'</span><button class="x" id="clrQ">'+T(UI.clearQ)+'</button>';
    document.getElementById("clrQ").addEventListener("click",function(){setQuestion(activeQ);});
    return;
  }
  banner.hidden=true;
}
function setQuestion(id){
  activeThread=null;
  activeQ=(activeQ===id)?null:id;
  renderQuestions(); applyHighlight();
  if(activeQ) document.getElementById("boardShell").scrollIntoView({behavior:"smooth",block:"nearest"});
}

function renderQuestions(){
  var g=document.getElementById("qgrid"); g.innerHTML="";
  QSETS.forEach(function(set){
    var panel=el("div","qpanel");
    panel.appendChild(el("header",null,"<h3>"+T(set.name)+"</h3><p>"+T(set.sub)+"</p>"));
    function mkList(qs){
      var ul=el("ul","qlist");
      qs.forEach(function(q){
        var li=document.createElement("li");
        var lead=(q.lead||[]).join(" ");
        var btn=el("button","qbtn",'<span class="qid">'+q.id.toUpperCase()+'</span><span>'+T(q.t)+'</span><span class="qn">'+lead+'</span>');
        btn.setAttribute("aria-pressed",String(activeQ===q.id));
        btn.addEventListener("click",function(){setQuestion(q.id);});
        li.appendChild(btn); ul.appendChild(li);
      });
      return ul;
    }
    if(set.qs){
      var s=el("div","qset"); s.appendChild(mkList(set.qs)); panel.appendChild(s);
      panel.appendChild(el("div","qnote",T(UI.qNoteP9)));
    }
    if(set.groups){
      set.groups.forEach(function(grp){
        var s2=el("div","qset");
        s2.appendChild(el("div","setname",'<span>'+T(grp.name)+'</span><span class="n">'+grp.qs.length+'</span>'));
        s2.appendChild(mkList(grp.qs)); panel.appendChild(s2);
      });
      panel.appendChild(el("div","qnote",T(UI.qNoteAward)));
    }
    g.appendChild(panel);
  });
}

/* dossier */
var scrim=document.getElementById("scrim"), dossier=document.getElementById("dossier");
function openDossier(m){
  openMind=m; dossier.style.setProperty("--mc","var("+m.v+")");
  function list(a){return a.map(function(i){return "<li><b>"+T(i.k)+"</b>. "+T(i.d)+' <span class="who">· '+T(i.s)+"</span></li>";}).join("");}
  dossier.innerHTML=
   '<div class="dos-top"><div><div class="id">'+m.n+'</div><h3>'+T(m.nm)+'</h3><p class="mission">'+T(m.mission)+'</p></div>'+
   '<button class="ctl" id="dosClose">'+T(UI.close)+'</button></div>'+
   '<div class="dos-link">'+T(UI.chainLink)+'  <b>'+T(m.lk)+'</b></div>'+
   '<div class="dos-grid"><div class="dos-col">'+
     '<div class="dos-block"><h4>'+T(UI.dosHP)+'</h4><ul class="dos-list">'+list(m.hp)+'</ul></div>'+
     '<div class="dos-block"><h4>'+T(UI.dosWet)+'</h4><ul class="dos-list">'+list(m.wet)+'</ul></div>'+
     '<div class="dos-block"><h4>'+T(UI.dosDry)+'</h4><ul class="dos-list">'+list(m.dry)+'</ul></div>'+
   '</div><div class="dos-col">'+
     '<div class="dos-block"><h4>'+T(UI.dosRubric)+'</h4><div class="tags-row">'+m.rubric.map(function(i){return '<span class="tag">'+T(RUBRIC[i])+'</span>';}).join("")+'</div></div>'+
     '<div class="dos-block"><h4>'+T(UI.dosCold)+'</h4><ol class="colist">'+m.cold.map(function(q){return "<li>"+T(q)+"</li>";}).join("")+'</ol></div>'+
     '<div class="dos-block"><div class="killbox"><h4>'+T(UI.dosKill)+'</h4><ul>'+
       m.kill.map(function(k){return '<li><span class="q">'+T(k.q)+'</span><span class="a">'+T(k.a)+'</span></li>';}).join("")+'</ul></div></div>'+
   '</div></div><div class="handoff">'+T(m.handoff)+'</div>';
  scrim.hidden=false; document.body.style.overflow="hidden";
  var cb=document.getElementById("dosClose"); cb.addEventListener("click",closeDossier); cb.focus();
}
function closeDossier(){scrim.hidden=true;openMind=null;document.body.style.overflow="";}
scrim.addEventListener("click",function(e){if(e.target===scrim)closeDossier();});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!scrim.hidden)closeDossier();});

function renderTodo(){
  var g=document.getElementById("todoList"); g.innerHTML="";
  var PRI={now:UI.todoNow,next:UI.todoNext,later:UI.todoLater};
  TODO.forEach(function(x){
    var d=el("div","todo");
    d.innerHTML='<div class="pri pri-'+x.pri+'">'+T(PRI[x.pri])+'</div>'+
      '<div class="body"><h4>'+T(x.t)+'</h4>'+
        '<p class="st"><span>'+T(UI.todoState)+'</span>'+T(x.now)+'</p>'+
        '<p class="do"><span>'+T(UI.todoDo)+'</span>'+T(x.next)+'</p>'+
        '<div class="ev">'+x.ev+'</div></div>'+
      '<div class="owner"><div class="mv">'+x.own.map(function(o){var m=byN[o];
        return '<span class="o" style="color:var('+m.v+')">'+o+' · '+T(m.nm)+'</span>';}).join("")+'</div>'+
        '<div class="unl"><span>'+T(UI.todoUnlocks)+'</span>'+T(x.unlocks)+'</div></div>';
    g.appendChild(d);
  });
}
function renderContra(){
  var g=document.getElementById("contraList"); g.innerHTML="";
  CONTRA.forEach(function(x){
    var d=el("div","card");
    d.innerHTML='<div class="q">'+T(x.q)+'</div><div class="why">'+T(x.why)+'</div>'+
      '<div class="shape"><b>'+T(UI.answerShape)+'</b>'+T(x.shape)+'</div>'+
      '<div class="minds">'+x.minds.map(function(o){var m=byN[o];
        return '<span class="mref" style="color:var('+m.v+');background:var('+m.soft+')">'+o+' '+T(m.nm)+'</span>';}).join("")+'</div>';
    g.appendChild(d);
  });
}

function renderAll(){
  renderStatic(); renderRubric(); renderBoard(); renderQuestions();
  if(!activeQ&&!activeThread) showIdle();
  renderTodo(); renderContra(); applyHighlight();
  if(openMind) openDossier(byN[openMind.n]);
}

document.getElementById("langEn").addEventListener("click",function(){setLang("e");});
document.getElementById("langZh").addEventListener("click",function(){setLang("z");});
function setLang(l){
  if(lang===l) return;
  lang=l; selChip=null;
  document.getElementById("langEn").setAttribute("aria-pressed",String(l==="e"));
  document.getElementById("langZh").setAttribute("aria-pressed",String(l==="z"));
  renderAll();
}
document.getElementById("themebtn").addEventListener("click",function(){
  var cur=document.documentElement.getAttribute("data-theme");
  var dark=window.matchMedia("(prefers-color-scheme: dark)").matches;
  var now=cur||(dark?"dark":"light");
  document.documentElement.setAttribute("data-theme", now==="dark"?"light":"dark");
});
var shell=document.getElementById("boardShell");
document.getElementById("fsBtn").addEventListener("click",function(){
  if(document.fullscreenElement) document.exitFullscreen();
  else if(shell.requestFullscreen) shell.requestFullscreen();
});
document.addEventListener("fullscreenchange",function(){
  document.getElementById("fsBtn").textContent=document.fullscreenElement?T(UI.fsOff):T(UI.fsOn);
});

renderAll();
})();
</script>
